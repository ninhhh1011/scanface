name: abc-hrm
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: abc_hrm
      POSTGRES_USER: abc_hrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abc_hrm -d abc_hrm"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres:
